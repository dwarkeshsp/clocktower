name: CI and deploy

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Production target (run from main)
        type: choice
        options: [all, site, play]
        default: all

permissions:
  contents: read

# Let an in-progress production deploy finish before starting another one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pyflakes clocktower tests
      # No API keys are set: the tests use random bots and fakes and never call a paid API.
      - run: python -m unittest discover -s tests -v

  targets:
    if: >-
      github.repository == 'dwarkeshsp/clocktower' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.changes.outputs.site }}
      play: ${{ steps.changes.outputs.play }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select deployment targets
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          site=false
          play=false
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo 'Skipping deployment of a commit that is no longer the tip of main.'
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            case "$TARGET" in
              all) site=true; play=true ;;
              site) site=true ;;
              play) play=true ;;
            esac
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            site=true
            play=true
          else
            git diff --name-only -z "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/tests.yml|pyproject.toml|requirements.txt)
                  site=true; play=true ;;
                site/*|games/*|docs/plans/*|docs/charts/*|docs/analysis/b2-mixed-rating.json|clocktower/export.py|clocktower/site_build.py)
                  site=true ;;
                clocktower/*)
                  site=true; play=true ;;
                Dockerfile|.dockerignore|fly.toml)
                  play=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "play=$play" >> "$GITHUB_OUTPUT"

  site:
    needs: [unit, targets]
    if: needs.targets.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: pip install -e .
      - name: Set the public log cache location
        run: echo "HF_HUB_CACHE=$RUNNER_TEMP/clocktower-hf-cache" >> "$GITHUB_ENV"
      - name: Resolve the public dataset revision
        id: dataset
        run: echo "revision=$(python -m clocktower.site_build --print-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/clocktower-hf-cache
          key: site-logs-v1-${{ steps.dataset.outputs.revision }}-${{ hashFiles('clocktower/site_build.py', 'clocktower/ratings.py', 'games/**/config.json', 'games/**/result.json') }}
          restore-keys: site-logs-v1-
      - name: Build and check the complete replay library
        env:
          DATASET_REVISION: ${{ steps.dataset.outputs.revision }}
        run: python -m clocktower.site_build --revision "$DATASET_REVISION"
      - name: Install Wrangler
        run: npm install --prefix "$RUNNER_TEMP/deploy-tools" --no-save --no-package-lock --no-audit --no-fund wrangler@4.164.0
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Add the CLOUDFLARE_API_TOKEN Actions secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add the CLOUDFLARE_ACCOUNT_ID Actions variable}"
          "$RUNNER_TEMP/deploy-tools/node_modules/.bin/wrangler" pages deploy site/dist \
            --project-name clocktowerbench --branch main --commit-hash "$GITHUB_SHA"

  play:
    needs: [unit, targets]
    if: needs.targets.outputs.play == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: '0.5.12'
      - name: Deploy the play server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          : "${FLY_API_TOKEN:?Add the FLY_API_TOKEN Actions secret}"
          flyctl deploy --app clocktower-play --remote-only --depot=false --ha=false --yes
      - name: Verify the play server
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 15 https://clocktower-play.fly.dev/healthz \
            | python3 -c 'import json, sys; data = json.load(sys.stdin); assert data.get("ok") is True, data; print("Play server healthy")'
