name: Hourly play check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-check
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'dwarkeshsp/clocktower' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Public API, practice bots only: no deployment or model credentials needed.
      - name: Start and end a practice game
        run: python -m clocktower.check_play --base-url https://play.clocktowerbench.com
