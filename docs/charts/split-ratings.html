<!doctype html><meta charset="utf-8"><title>Detection vs deception</title>
<style>
/* Static figure for the blog: detection (good) and deception (evil) Elo by release date, two panels on one scale. */
html,body{margin:0;background:#fcfcfb}
body{width:1200px;font-family:Inter,system-ui,sans-serif;color:#141a22}
.wrap{padding:44px 52px 30px}
h1{font:700 34px/1.15 "Inter Display",Inter,sans-serif;margin:0 0 14px;letter-spacing:-.01em}
.legend{margin-bottom:6px;display:flex;gap:26px;font-size:16px;color:#4b5563;align-items:center}
.legend i{display:inline-block;width:13px;height:13px;margin-right:8px;vertical-align:-1px}
svg text{font-family:Inter,sans-serif}
</style>
<div class="wrap">
  <h1>Detection vs deception</h1>
  <div class="legend"><span><i style="background:#0A7FA0;border-radius:2px"></i>OpenAI</span><span><i style="background:#C2562E;border-radius:50%"></i>Anthropic</span><span>Bars: 90% intervals</span></div>
  <svg id="c"></svg>
</div>
<script>
const D=__DATA__;
const N={'claude-opus-4-6':'Opus 4.6','gpt-5.4':'GPT-5.4','claude-opus-4-7':'Opus 4.7','gpt-5.5':'GPT-5.5','claude-opus-4-8':'Opus 4.8','claude-fable-5':'Fable 5','gpt-5.6-sol':'GPT-5.6 Sol','claude-fable-5-1':'Fable 5.1','gpt-6-astra':'GPT-6 Astra','claude-opus-5-5':'Opus 5.5','gpt-6.1-sol':'GPT-6.1 Sol','claude-fable-5-2':'Fable 5.2'};
// labels go right of the dot unless listed here (to dodge a close neighbour)
const LEFT={detection:['gpt-6-astra','gpt-6.1-sol'],deception:['claude-fable-5-1','gpt-6-astra','gpt-6.1-sol']},BELOW={detection:[],deception:['gpt-5.4']};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('c');
const el=(t,a,x)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;svg.appendChild(e);return e};
const W=1096,H=650,T=66,B=44,lo=1000,hi=2100,y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
const day=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)),t0=Date.UTC(2026,0,20),t1=Date.UTC(2026,10,15);
svg.setAttribute('width',W);svg.setAttribute('height',H);
el('text',{x:12,y:(T+H-B)/2,'text-anchor':'middle','font-size':16,'font-weight':600,fill:'#4b5563',transform:`rotate(-90 12 ${(T+H-B)/2})`},'Elo');
for(let v=lo;v<=hi;v+=100)el('text',{x:82,y:y(v)+5,'text-anchor':'end','font-size':14,fill:'#7b8494'},v.toLocaleString('en-US'));
const panels=[['detection','d90','Detection (playing good)',96,560],['deception','v90','Deception (playing evil)',596,1060]];
for(const [key,ci,title,x0,x1] of panels){
  const x=s=>x0+14+(day(s)-t0)/(t1-t0)*(x1-x0-110);
  el('text',{x:x0,y:34,'font-size':19,'font-weight':700,fill:'#141a22'},title);
  for(let v=lo;v<=hi;v+=100)el('line',{x1:x0,x2:x1,y1:y(v),y2:y(v),stroke:v===lo?'#cfd4db':'#eceef1'});
  for(let m=1;m<=11;m+=2){const s=`2026-${String(m+1).padStart(2,'0')}-01`;el('text',{x:x(s),y:H-B+28,'text-anchor':'middle','font-size':14,fill:'#7b8494'},MON[m])}
  for(const m of D.models){const c=m.lab==='Anthropic'?'#C2562E':'#0A7FA0',bx=x(m.date),st={stroke:c,'stroke-width':2.5,'stroke-linecap':'round','stroke-opacity':.35};
    el('line',{x1:bx,x2:bx,y1:y(m[ci][0]),y2:y(m[ci][1]),...st});for(const v of m[ci])el('line',{x1:bx-6,x2:bx+6,y1:y(v),y2:y(v),...st})}
  for(const m of D.models){const c=m.lab==='Anthropic'?'#C2562E':'#0A7FA0',cx=x(m.date),cy=y(m[key]),left=LEFT[key].includes(m.id),below=BELOW[key].includes(m.id);
    if(m.lab==='Anthropic')el('circle',{cx,cy,r:7.5,fill:c});else el('rect',{x:cx-7,y:cy-7,width:14,height:14,rx:2,fill:c});
    el('text',{x:below?cx:left?cx-13:cx+13,y:below?cy+26:cy+5,'text-anchor':below?'middle':left?'end':'start','font-size':14.5,'font-weight':600,fill:'#141a22',stroke:'#fcfcfb','stroke-width':6,'stroke-linejoin':'round','paint-order':'stroke'},N[m.id])}
}
</script>
